
services:
  pocketbase:
    build:
      context: .
      args:
        VERSION: 0.28.1
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - ADMIN_EMAIL=admin@example.com  # 超级用户邮箱
      - ADMIN_PASSWORD=1234567890  # 超级用户密码 
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketbase.rule=Host(`${DOMAIN:-pocketbase.localhost}`)"
      - "traefik.http.routers.pocketbase.entrypoints=web"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true 