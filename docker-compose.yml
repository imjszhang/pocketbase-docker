services:
  pocketbase:
    build:
      context: .
      args:
        VERSION: 0.28.1
    container_name: pocketbase-${DB_NAME:-test}
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /home/vagrant/dokploy/data/pocketbase/${DB_NAME:-test}/pb_data:/usr/local/bin/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://${DB_NAME:-test}.${DOMAIN:-pocketbase.localhost}/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - DB_NAME=${DB_NAME:-test}
      - ADMIN_EMAIL=admin@example.com  
      - ADMIN_PASSWORD=1234567890 
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketbase.rule=Host(`${DB_NAME:-test}.${DOMAIN:-pocketbase.localhost}`)"
      - "traefik.http.routers.pocketbase.entrypoints=web"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true 